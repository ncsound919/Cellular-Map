version: '3.8'

services:
  neo4j:
    image: neo4j:5.20
    container_name: networkology-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/networkology
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - networkology

  redis:
    image: redis:7-alpine
    container_name: networkology-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - networkology

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: networkology-backend
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=networkology
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - neo4j
      - redis
    networks:
      - networkology

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: networkology-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - networkology

volumes:
  neo4j_data:
  neo4j_logs:
  redis_data:

networks:
  networkology:
    driver: bridge
